<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Buy Requirement | BHARAT ORGANIC MART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --organic-green: #2D5A27; --organic-dark: #1E401D; }
        .bg-organic { background-color: var(--organic-green); }
        .text-organic { color: var(--organic-green); }
        .border-organic { border-color: var(--organic-green); }
        .hover-organic:hover { background-color: var(--organic-dark); }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-white border-b shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-shopping-cart text-organic text-xl"></i>
                <h1 class="text-xl font-bold text-organic uppercase tracking-tight">Post Buy Requirement</h1>
            </div>
            <a href="index.html" class="text-sm text-gray-600 hover:text-organic transition">
                <i class="fas fa-arrow-left mr-1"></i> Back to Home
            </a>
        </div>
    </header>

    <div class="flex-grow">
        <div class="max-w-3xl mx-auto px-6 py-8">

            <!-- INTRO -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900">What are you looking for?</h2>
                <p class="text-gray-500 text-sm mt-1">
                    Tell verified organic suppliers what you need. They will respond with quotations directly to your email.
                </p>
            </div>

            <!-- FORM -->
            <form id="rfqForm" class="bg-white p-8 rounded-xl border shadow-sm space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Product / Commodity <span class="text-red-500">*</span></label>
                        <input type="text" id="rfqTitle" placeholder="e.g. Organic Basmati Rice" required class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Category</label>
                        <select id="rfqCategory" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                            <option value="">-- Select --</option>
                            <option value="Grains & Cereals">Grains & Cereals</option>
                            <option value="Pulses">Pulses</option>
                            <option value="Spices">Spices</option>
                            <option value="Oilseeds">Oilseeds</option>
                            <option value="Millets">Millets</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Organic Seeds">Organic Seeds</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Quantity Needed <span class="text-red-500">*</span></label>
                        <input type="number" id="rfqQty" placeholder="e.g. 10" required min="1" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Unit</label>
                        <select id="rfqUnit" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                            <option value="MT">Metric Tonne (MT)</option>
                            <option value="KG">Kilogram (KG)</option>
                            <option value="QUINTAL">Quintal</option>
                            <option value="PIECES">Pieces</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Required Certification</label>
                        <select id="rfqCert" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                            <option value="">Any / Not Specified</option>
                            <option value="NPOP">NPOP (India)</option>
                            <option value="NOP">USDA NOP (USA)</option>
                            <option value="EU">EU Organic</option>
                            <option value="PGS">PGS-India</option>
                            <option value="FSSAI">FSSAI Organic</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Delivery Destination</label>
                        <input type="text" id="rfqDest" placeholder="e.g. Nhava Sheva Port, Mumbai" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Target Price (optional)</label>
                        <input type="number" step="0.01" id="rfqPrice" placeholder="e.g. 85.00" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Expected Delivery Date</label>
                        <input type="date" id="rfqDate" class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Message to Suppliers</label>
                    <textarea id="rfqMessage" rows="4" placeholder="Describe quality specs, packaging needs, payment terms..." class="w-full border rounded-lg pl-3 py-2.5 text-sm focus:outline-none focus:border-organic focus:ring-2 focus:ring-organic/20"></textarea>
                </div>

                <div class="pt-4">
                    <button type="submit" id="rfqSubmitBtn" class="bg-organic text-white px-8 py-3 rounded-lg font-bold text-lg hover:bg-green-800 transition shadow-lg hover:shadow-organic/40 w-full">
                        <i class="fas fa-paper-plane mr-2"></i> Post Requirement
                    </button>
                </div>
            </form>

            <!-- STATUS ALERT -->
            <div id="rfqStatus" class="hidden mt-6 p-4 rounded-lg text-sm"></div>

        </div>
    </div>

    <footer class="bg-white border-t py-8 mt-12">
        <div class="max-w-7xl mx-auto px-6 text-center text-gray-500 text-sm">
            <p>&copy; 2026 BHARAT ORGANIC MART. All rights reserved.</p>
        </div>
    </footer>

    <script>
        const form = document.getElementById('rfqForm');
        const statusBox = document.getElementById('rfqStatus');
        const submitBtn = document.getElementById('rfqSubmitBtn');

        function showAlert(msg, type = 'error') {
            statusBox.className = `mt-6 p-4 rounded-lg text-sm ${type === 'success' ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-red-50 border border-red-200 text-red-800'}`;
            statusBox.textContent = msg;
            statusBox.classList.remove('hidden');
        }

        function setLoading(loading) {
            submitBtn.disabled = loading;
            submitBtn.textContent = loading ? 'Posting...' : 'Post Requirement';
            submitBtn.classList.toggle('opacity-75', loading);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading(true);

            try {
                const session = await BOMAuth.session();
                if (!session) {
                    window.location.replace('login.html?next=rfq-post.html');
                    return;
                }

                const { error } = await BOMAuth.sb.from('buyer_requirements').insert([{
                    title: document.getElementById('rfqTitle').value.trim(),
                    category: document.getElementById('rfqCategory').value,
                    required_quantity: parseFloat(document.getElementById('rfqQty').value),
                    quantity_unit: document.getElementById('rfqUnit').value,
                    certification_required: document.getElementById('rfqCert').value || null,
                    delivery_destination: document.getElementById('rfqDest').value.trim(),
                    target_price: parseFloat(document.getElementById('rfqPrice').value) || null,
                    expected_delivery_date: document.getElementById('rfqDate').value || null,
                    message: document.getElementById('rfqMessage').value.trim(),
                    buyer_email: session.user.email,
                    buyer_name: session.user.user_metadata?.full_name || session.user.email,
                    status: 'open'
                }]);

                if (error) throw error;

                showAlert('✅ Your requirement has been posted! Verified suppliers will contact you shortly.', 'success');
                form.reset();
            } catch (err) {
                console.error('RFQ error:', err);
                showAlert('Failed to post requirement: ' + (err.message || 'Unknown error'), 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
